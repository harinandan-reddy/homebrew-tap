name: redpanda-cpp
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream royqh1979/RedPanda-CPP tag
        default: v3.4
permissions:
  contents: write
  pull-requests: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-15 }
          - { arch: x86_64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: royqh1979/RedPanda-CPP
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.0
          host: mac
          target: desktop
          arch: clang_64
          # lrelease depends on QtQml framework (qtdeclarative package)
          archives: qtbase qtdeclarative qtsvg qttools qttranslations
      - run: ./packages/macos/build.sh --qt-dir "$RUNNER_WORKSPACE/Qt/6.11.0/macos"
      - name: Zip
        run: |
          ver=${{ inputs.tag }}; ver=${ver#v}
          # build.sh tars before codesign, so zip the signed bundle ourselves
          ditto -c -k --keepParent build/macos-pkg/RedPandaIDE.app \
            "RedPandaIDE-$ver-macos-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: RedPandaIDE-*.zip
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          merge-multiple: true
      - name: Release and bump cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=${{ inputs.tag }}; ver=${ver#v}
          arm=$(sha256sum RedPandaIDE-$ver-macos-arm64.zip | cut -d' ' -f1)
          intel=$(sha256sum RedPandaIDE-$ver-macos-x86_64.zip | cut -d' ' -f1)
          gh release create "redpanda-cpp-$ver" RedPandaIDE-*.zip \
            --title "Red Panda C++ $ver (macOS)" \
            --notes "Unofficial macOS build of https://github.com/royqh1979/RedPanda-CPP/releases/tag/${{ inputs.tag }} (GPL-3.0). Source and build script are upstream's packages/macos/build.sh."
          f=Casks/redpanda-cpp.rb
          sed -i "s/^  version \".*\"/  version \"$ver\"/" $f
          sed -i -E "s/(arm: +)\"[0-9a-f]+\"/\1\"$arm\"/; s/(intel: +)\"[0-9a-f]+\"/\1\"$intel\"/" $f
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout -b bump/redpanda-cpp-$ver
          git commit -am "feat: redpanda-cpp $ver"
          git push -f origin HEAD
          gh pr create --fill --base main
