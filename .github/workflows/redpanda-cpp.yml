name: redpanda-cpp
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream royqh1979/RedPanda-CPP branch, tag or commit
        default: master
  pull_request: # build-only check; release job runs on dispatch only
    paths: [.github/workflows/redpanda-cpp.yml]
permissions:
  contents: write
  pull-requests: write
jobs:
  build:
    runs-on: macos-14
    outputs:
      ver: ${{ steps.zip.outputs.ver }}
      sha: ${{ steps.zip.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: royqh1979/RedPanda-CPP
          ref: ${{ inputs.ref || 'master' }}
          fetch-depth: 0
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.0
          host: mac
          target: desktop
          arch: clang_64
          # lrelease depends on QtQml framework (qtdeclarative package)
          archives: qtbase qtdeclarative qtsvg qttools qttranslations
      - name: Make build.sh universal
        run: |
          # ponytail: build.sh pins CMAKE_OSX_ARCHITECTURES to uname -m; breaks if upstream rewrites that line
          sed -i '' 's|-DCMAKE_OSX_ARCHITECTURES="$arch_info"|-DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"|' packages/macos/build.sh
          grep -q 'x86_64;arm64' packages/macos/build.sh
      - run: ./packages/macos/build.sh --qt-dir "$RUNNER_WORKSPACE/Qt/6.11.0/macos"
      - name: Sign and zip
        id: zip
        run: |
          ver=$(jq -r '"\(.major).\(.minor).\(.patch)" + (if .preRelease != "" and .preRelease != null then "-\(.preRelease)" else "" end)' version.json)
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          app=build/macos-pkg/RedPandaIDE.app
          for b in "$app"/Contents/MacOS/*; do
            archs=$(lipo -archs "$b")
            echo "$b: $archs"
            [[ "$archs" == *x86_64* && "$archs" == *arm64* ]] || { echo "not universal: $b"; exit 1; }
          done
          # macdeployqt bundles the frameworks but the binary has no LC_RPATH, so dyld cannot find them
          install_name_tool -add_rpath @executable_path/../Frameworks "$app/Contents/MacOS/RedPandaIDE"
          # upstream's Info.plist template ships these keys empty
          for kv in CFBundleIdentifier=com.royqh.RedPandaIDE CFBundleName=RedPandaIDE \
                    CFBundleShortVersionString=${ver%%-*} CFBundleVersion=${ver%%-*}; do
            plutil -replace "${kv%%=*}" -string "${kv#*=}" "$app/Contents/Info.plist"
          done
          # build.sh tars before codesign, so sign and zip the bundle ourselves
          codesign --force --deep --sign - "$app"
          ditto -c -k --keepParent "$app" "RedPandaIDE-$ver-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: RedPandaIDE-*.zip
  release:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos
      - name: Release and bump cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=${{ needs.build.outputs.ver }}
          sum=$(sha256sum RedPandaIDE-$ver-macos.zip | cut -d' ' -f1)
          gh release delete "redpanda-cpp-$ver" --cleanup-tag --yes 2>/dev/null || true # rebuild of same version
          gh release create "redpanda-cpp-$ver" RedPandaIDE-*.zip \
            --title "Red Panda C++ $ver (macOS)" \
            --notes "Unofficial universal (x86_64 + arm64) macOS build (GPL-3.0) of https://github.com/royqh1979/RedPanda-CPP/commit/${{ needs.build.outputs.sha }} using upstream's packages/macos/build.sh."
          f=Casks/redpanda-cpp.rb
          sed -i "s/^  version \".*\"/  version \"$ver\"/" $f
          sed -i "s/^  sha256 \".*\"/  sha256 \"$sum\"/" $f
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout -b bump/redpanda-cpp-$ver
          git commit -am "feat: redpanda-cpp $ver"
          git push -f origin HEAD
          gh pr create --fill --base main || true # push -f already updated an open bump PR
