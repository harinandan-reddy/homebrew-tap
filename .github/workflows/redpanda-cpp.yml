name: redpanda-cpp
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream royqh1979/RedPanda-CPP tag
        default: v3.4
permissions:
  contents: write
  pull-requests: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: royqh1979/RedPanda-CPP
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.1
          host: mac
          target: desktop
          arch: clang_64
          # lrelease depends on QtQml framework (qtdeclarative package)
          archives: qtbase qtdeclarative qtsvg qttools qttranslations
      # build.sh at v3.4 defaults to a universal (x86_64 + arm64) build
      - run: ./packages/macos/build.sh --qt-install-dir "$RUNNER_WORKSPACE/Qt" --qt-version 6.8.1
      - name: Sign and zip
        run: |
          ver=${{ inputs.tag }}; ver=${ver#v}
          app=pkg/universal/bin/RedPandaIDE.app
          codesign --force --deep --sign - "$app"
          ditto -c -k --keepParent "$app" "RedPandaIDE-$ver-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: RedPandaIDE-*.zip
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos
      - name: Release and bump cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=${{ inputs.tag }}; ver=${ver#v}
          sum=$(sha256sum RedPandaIDE-$ver-macos.zip | cut -d' ' -f1)
          gh release create "redpanda-cpp-$ver" RedPandaIDE-*.zip \
            --title "Red Panda C++ $ver (macOS)" \
            --notes "Unofficial macOS build of https://github.com/royqh1979/RedPanda-CPP/releases/tag/${{ inputs.tag }} (GPL-3.0). Source and build script are upstream's packages/macos/build.sh."
          f=Casks/redpanda-cpp.rb
          sed -i "s/^  version \".*\"/  version \"$ver\"/" $f
          sed -i "s/^  sha256 \".*\"/  sha256 \"$sum\"/" $f
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout -b bump/redpanda-cpp-$ver
          git commit -am "feat: redpanda-cpp $ver"
          git push -f origin HEAD
          gh pr create --fill --base main
