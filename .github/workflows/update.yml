name: update
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo=SigNoz/signoz-mcp-server
          f=Formula/signoz-mcp-server.rb
          tag=$(gh release view --repo $repo --json tagName --jq .tagName)
          ver=${tag#v}
          grep -q "version \"$ver\"" $f && exit 0
          sums=$(gh release download "$tag" --repo $repo -p '*checksums.txt' -O -)
          sed -i "s/version \".*\"/version \"$ver\"/" $f
          while read -r sum name; do
            sed -i "/$name/{n;s/sha256 \".*\"/sha256 \"$sum\"/}" $f
          done <<< "$sums"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout -b bump/signoz-mcp-server-$ver
          git commit -am "feat: signoz-mcp-server $ver"
          git push -f origin HEAD
          gh pr create --fill --base main
          gh pr merge --rebase --delete-branch
  bump-github:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: scip, repo: scip-code/scip }
          - { name: scip-java, repo: scip-code/scip-java }
          - { name: cc-sessions, repo: chronologos/cc-sessions }
          - { name: codegraph, repo: colbymchenry/codegraph }
          - { name: abtop, repo: graykode/abtop }
    steps:
      - uses: actions/checkout@v4
      - name: Bump formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(.github/bump.sh ${{ matrix.name }} ${{ matrix.repo }})
          [ -n "$ver" ] || exit 0
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout -b bump/${{ matrix.name }}-$ver
          git commit -am "feat: ${{ matrix.name }} $ver"
          git push -f origin HEAD
          gh pr create --fill --base main
          gh pr merge --rebase --delete-branch
  junie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate junie casks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/gen.sh
          git diff --quiet && exit 0
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout -b junie/update-$(date +%s)
          for f in $(git diff --name-only); do
            ver=$(grep -m1 '^  version' $f | cut -d'"' -f2)
            git commit -m "feat: $(basename $f .rb) $ver" $f
          done
          git push origin HEAD
          gh pr create --fill --base main
          gh pr merge --rebase --delete-branch
