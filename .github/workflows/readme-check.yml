name: readme-check
on: [pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rc=0
          for f in Casks/*.rb Formula/*.rb; do
            n=$(basename "$f" .rb); n=${n%%@*}
            grep -qE "tap/$n([^a-zA-Z0-9@-]|$)" README.md || { echo "README missing: $n"; rc=1; }
          done
          exit $rc
      - name: Headings sorted
        run: |
          awk '
            /^## /  { prev = "" ; next }
            /^### / { t = tolower(substr($0, 5))
                      if (prev != "" && t < prev) { print "README out of order: " substr($0, 5); bad = 1 }
                      prev = t }
            END { exit bad }
          ' README.md
